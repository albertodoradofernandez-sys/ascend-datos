    <script>
      // Ascend Web, modo demo (?demo, ?demo=en): entra directo con el personaje de ejemplo, sin bienvenida ni recorrido.
      // Va aquí para que se aplique antes de que la app lea sus ajustes. En la app de escritorio no hace nada.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          if (!q.has('demo')) return;
          sessionStorage.setItem('ascend.demo', '1');
          localStorage.setItem('ascend.recorrido.visto', '1');
          localStorage.setItem('ascend.autoPersonajes', String(Date.now()));
          var a = JSON.parse(localStorage.getItem('ascend.ajustes') || '{}');
          if (q.get('demo') === 'en' || q.get('demo') === 'es') a.idioma = q.get('demo');
          a.idioma = a.idioma || 'es';
          localStorage.setItem('ascend.ajustes', JSON.stringify(a));
          localStorage.setItem('ascend.pj', 'DEMO');
        } catch (e) {}
      })();
    </script>
